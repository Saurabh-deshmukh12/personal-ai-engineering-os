[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-os"
version = "0.1.0"
description = "Personal AI Engineering Operating System - a reusable, local-first system for understanding projects, maintaining scoped engineering memory, and running specialized AI agents/skills/hooks across projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All rights reserved" }
authors = [{ name = "Saurabh Deshmukh" }]

dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "platformdirs>=4.2,<5",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2",
    "types-PyYAML>=6.0",
]

[project.scripts]
ai-os = "ai_os.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
